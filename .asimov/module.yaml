# See: https://asimov-specs.github.io/module-manifest/
---
name: solana
label: Solana
title: ASIMOV Solana Module
summary: Imports structured data from the Solana blockchain network.
links:
  - https://github.com/asimov-modules/asimov-solana-module
  - https://crates.io/crates/asimov-solana-module

provides:
  programs:
    - asimov-solana-fetcher

handles:
  url_protocols:
    - solana
  url_prefixes:
    - "solana://mainnet/"
    - "solana://devnet/"
    - "solana://testnet/"
  url_patterns:
    - "solana://*/*"
  file_extensions:
  content_types:
