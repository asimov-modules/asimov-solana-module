# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "asimov-solana-module"
version = "0.0.0"
authors = ["ASIMOV Community"]
edition = "2024"
#rust-version = "1.85"
description = "ASIMOV module for data import from the Solana blockchain network."
#documentation = "https://docs.rs/asimov-solana-module"
readme = true
homepage = "https://github.com/asimov-modules"
repository = "https://github.com/asimov-modules/asimov-solana-module"
license = "Unlicense"
keywords = ["asimov-module", "asimov", "solana", "blockchain", "ai"]
categories = ["command-line-utilities", "text-processing"]
publish = false

[features]
default = ["all", "cli", "std"]
all = ["pretty", "tracing"]
cli = ["asimov-module/cli", "std", "dep:clap", "dep:clientele"]
std = ["asimov-module/std", "clap?/std", "clientele?/std", "dep:ureq", "dep:serde_json"]
unstable = []

# Optional features:
pretty = []
tracing = ["asimov-module/tracing", "clientele?/tracing"]

[dependencies]
asimov-module = { version = "25.0.0-dev.21", default-features = false }
url = { version = "2", default-features = false }

# Optional integrations:
clap = { version = "4.5", default-features = false, features = [
  "std",
], optional = true }
clientele = { version = "0.3.8", default-features = false, features = [
  "clap",
  "std",
], optional = true }
ureq = { version = "3", optional = true }
serde_json = { version = "1", optional = true }

[profile.release]
opt-level = "z"
strip = true
lto = "thin"

[[bin]]
name = "asimov-solana-fetcher"
path = "src/fetcher/main.rs"
required-features = ["cli"]
